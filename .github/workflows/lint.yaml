---
name: Lint, Unit & Integration

"on":
  pull_request:

jobs:
  lint-unit:
    uses: test-kitchen/.github/.github/workflows/lint-unit.yml@main

  integration:
    name: Test Kitchen (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    needs: lint-unit
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.1"
          - "3.4"
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # Drives the plugin through Test Kitchen -- discovery by name,
      # required_config validation, default_config, and the kitchen CLI --
      # using the kitchen.yml in the repo root. Creating and converging needs
      # a real vRO appliance, which CI has no access to; everything up to that
      # point does not.
      - name: Exercise the driver through Test Kitchen
        run: bundle exec rake integration
